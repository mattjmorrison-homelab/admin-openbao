name: OpenTofu

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.12.0"
          tofu_wrapper: false
      - name: Format check
        run: tofu fmt -check -recursive
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
      - run: tflint --init
      - run: tflint
      - uses: mattjmorrison-homelab/actions-tofu/fetch-credentials@58daf722248c6ba7c9308cf67b6ec3dd58ddff39
      - run: tofu init
      - run: tofu plan -out=tfplan
      - uses: mattjmorrison-homelab/actions-tofu/upload-plan@c4e78822f8a60715ebb3895992e5fbe8db60e76f
        with:
          key: plans/${{ github.repository }}/${{ github.sha }}/tfplan

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: mattjmorrison-homelab/actions-tofu/fetch-credentials@58daf722248c6ba7c9308cf67b6ec3dd58ddff39
      - uses: mattjmorrison-homelab/actions-tofu/download-plan@c4e78822f8a60715ebb3895992e5fbe8db60e76f
        with:
          key: plans/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/tfplan
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.12.0"
          tofu_wrapper: false
      - run: tofu init
      - run: tofu apply -auto-approve tfplan
