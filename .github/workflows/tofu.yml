name: OpenTofu

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# VAULT_ADDR/VAULT_TOKEN stay regardless of the OIDC migration below --
# provider.tf's `provider "vault" {}` block authenticates every tofu
# plan/apply with the OpenBao root token (the one credential that can't
# be sourced from OpenBao itself), which is a completely separate concern
# from how CI fetches its own S3-backend credentials. OIDC only replaces
# the latter.
env:
  VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: k8s-amd64
    # OIDC (todo #17): this job authenticates to OpenBao via GitHub's own
    # OIDC token -- id-token: write is what lets this job request one.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.12.0"
          tofu_wrapper: false
      - name: Format check
        run: tofu fmt -check -recursive
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
      - run: tflint --init
      - run: tflint
      # OIDC (todo #17): fetches AWS state creds via GitHub OIDC + OpenBao's
      # jwt auth method -- one login, one policy, since admin-openbao's CI
      # only ever needs its own tofu-state credentials.
      - name: Fetch credentials via GitHub OIDC + OpenBao jwt auth
        run: |
          GH_OIDC_TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openbao" | jq -r '.value')

          vault_login() {
            curl -sf -X POST "$VAULT_ADDR/v1/auth/jwt/login" \
              -d "$(jq -nc --arg jwt "$GH_OIDC_TOKEN" --arg role "$1" '{jwt: $jwt, role: $role}')" \
              | jq -r '.auth.client_token'
          }
          fetch_secret() {
            curl -sf -H "X-Vault-Token: $1" "$VAULT_ADDR/v1/kv/data/$2" | jq -r '.data.data.value'
          }

          TOFU_STATE_TOKEN=$(vault_login admin-openbao-tofu-state-oidc)
          ACCESS_KEY_ID=$(fetch_secret "$TOFU_STATE_TOKEN" homelab/service/k8s-garage/admin-openbao/tofu-state-access-key-id)
          SECRET_ACCESS_KEY=$(fetch_secret "$TOFU_STATE_TOKEN" homelab/service/k8s-garage/admin-openbao/tofu-state-secret-access-key)

          echo "::add-mask::$ACCESS_KEY_ID"
          echo "::add-mask::$SECRET_ACCESS_KEY"
          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
      - run: tofu init
      - run: tofu test
      - run: tofu plan -out=tfplan
      - uses: mattjmorrison-homelab/actions-tofu/upload-plan@c4253df5832781cf10d3b5dda78c135e6eed2a6b
        with:
          key: plans/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/tfplan
          bucket: admin-openbao-tofu-state

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: k8s-amd64
    # OIDC (todo #17): same role/mechanism proven in the check job -- one
    # pair of roles per repo, reused across every job in that repo, since
    # the bound_claims only distinguish "which repo", not "which job".
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      # OIDC (todo #17): fetches AWS state creds via GitHub OIDC + OpenBao's
      # jwt auth method -- one login, one policy, same as the check job.
      - name: Fetch credentials via GitHub OIDC + OpenBao jwt auth
        run: |
          GH_OIDC_TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openbao" | jq -r '.value')

          vault_login() {
            curl -sf -X POST "$VAULT_ADDR/v1/auth/jwt/login" \
              -d "$(jq -nc --arg jwt "$GH_OIDC_TOKEN" --arg role "$1" '{jwt: $jwt, role: $role}')" \
              | jq -r '.auth.client_token'
          }
          fetch_secret() {
            curl -sf -H "X-Vault-Token: $1" "$VAULT_ADDR/v1/kv/data/$2" | jq -r '.data.data.value'
          }

          TOFU_STATE_TOKEN=$(vault_login admin-openbao-tofu-state-oidc)
          ACCESS_KEY_ID=$(fetch_secret "$TOFU_STATE_TOKEN" homelab/service/k8s-garage/admin-openbao/tofu-state-access-key-id)
          SECRET_ACCESS_KEY=$(fetch_secret "$TOFU_STATE_TOKEN" homelab/service/k8s-garage/admin-openbao/tofu-state-secret-access-key)

          echo "::add-mask::$ACCESS_KEY_ID"
          echo "::add-mask::$SECRET_ACCESS_KEY"
          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
      - uses: mattjmorrison-homelab/actions-tofu/download-plan@c4253df5832781cf10d3b5dda78c135e6eed2a6b
        with:
          key: plans/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/tfplan
          bucket: admin-openbao-tofu-state
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.12.0"
          tofu_wrapper: false
      - run: tofu init
      - run: tofu apply -auto-approve tfplan
