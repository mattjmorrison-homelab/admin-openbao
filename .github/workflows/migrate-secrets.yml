name: One-time secret migration

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          If true, fetches every source value and reports what would be
          written, but writes nothing. Run once with this true, review
          the log, then run again with it false to actually migrate.
        type: boolean
        default: true

env:
  VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

jobs:
  migrate:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/migrate-secrets.sh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
